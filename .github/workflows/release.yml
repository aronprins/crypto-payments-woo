# Builds crypto-payments-woo.zip and update.json and publishes a GitHub release when a version tag is pushed.
# Sites running the plugin read update.json and pick the release up as a normal WordPress plugin update.
#
#   git tag v1.3.0 && git push origin v1.3.0
#
# Tags with a hyphen (v1.3.0-beta.1) are published as pre-releases, which sites ignore.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check the version numbers match the tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          TAG="${TAG%%-*}"
          HEADER=$(grep -m1 -E '^[[:space:]]*\*[[:space:]]*Version:' crypto-payments-woo.php | awk '{print $NF}')
          CONSTANT=$(grep -m1 "define( 'CPW_VERSION'" crypto-payments-woo.php | sed -E "s/.*'CPW_VERSION', *'([^']+)'.*/\1/")
          STABLE=$(grep -m1 -E '^Stable tag:' readme.txt | awk '{print $NF}')
          echo "Tag: $TAG | Plugin header: $HEADER | CPW_VERSION: $CONSTANT | readme Stable tag: $STABLE"
          for found in "$HEADER" "$CONSTANT" "$STABLE"; do
            if [ "$found" != "$TAG" ]; then
              echo "::error::Version mismatch. Set Version and CPW_VERSION in crypto-payments-woo.php and Stable tag in readme.txt to $TAG."
              exit 1
            fi
          done

      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Write the release notes and update.json
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%%-*}"
          mkdir -p build
          # Both fail when readme.txt has no "= x.y.z =" changelog entry for this version.
          php .github/scripts/release-meta.php notes "$VERSION" > build/notes.md
          php .github/scripts/release-meta.php update "$VERSION" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > build/update.json
          cat build/notes.md

      - name: Build crypto-payments-woo.zip
        run: |
          set -euo pipefail
          mkdir -p build/crypto-payments-woo
          tar -c --exclude-from=.distignore --exclude=./build -f - . | tar -x -C build/crypto-payments-woo
          (cd build && zip -qr crypto-payments-woo.zip crypto-payments-woo)
          unzip -l build/crypto-payments-woo.zip
          # Sites install this zip, so make sure it is really the plugin.
          unzip -l build/crypto-payments-woo.zip | grep -q ' crypto-payments-woo/crypto-payments-woo.php$'

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FLAGS=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then FLAGS="--prerelease"; fi
          ASSETS="build/crypto-payments-woo.zip build/update.json"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # A release drafted by hand for this tag: keep its notes, attach the files (replacing old ones) and publish it.
            gh release upload "$GITHUB_REF_NAME" $ASSETS --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false $FLAGS
          else
            # gh uploads the files before publishing, so sites never see a release without its zip.
            gh release create "$GITHUB_REF_NAME" $ASSETS --title "Crypto Payments for WooCommerce ${GITHUB_REF_NAME#v}" --notes-file build/notes.md --verify-tag $FLAGS
          fi
